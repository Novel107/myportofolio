{% extends 'base.html' %}

{% block content %}
    <main>
        <section class="experience-section" id="experience">
            <div class="container">
                <p class="section-kicker">Perjalanan saya sejauh ini</p>
                <h1>Experience</h1>
                
                <!-- Fitur Pencarian -->
                <div style="margin-top: 1rem; margin-bottom: 2rem;">
                    <form id="experience-search-form" onsubmit="return false;">
                        <input type="text" id="search-input" placeholder="Cari pengalaman berdasarkan judul..." style="width: 100%; max-width: 400px; padding: 0.75rem; border: 1px solid var(--line); border-radius: 5px; background: var(--bg);">
                    </form>
                </div>

                {% if user.is_superuser %}
                <div style="margin-bottom: 2rem; margin-top: 1rem;">
                    <button type="button" popovertarget="add-experience-modal" style="padding: 10px 20px; background-color: #000; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 0.9rem; border: none; cursor: pointer;">
                        + Tambah Pengalaman Baru
                    </button>
                </div>

                <div id="add-experience-modal" class="project-form-modal" popover="auto">
                    <div class="project-form-modal_content" style="max-width: 500px;">
                        <h2 style="margin-bottom: 1rem;">Tambah Pengalaman Baru</h2>
                        <form id="experience-form">
                            {% csrf_token %}
                            <div style="margin-bottom: 1rem;">
                                <label for="title" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Judul</label>
                                <input type="text" id="title" name="title" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 5px; background: var(--bg);">
                            </div>
                            <div style="margin-bottom: 1rem;">
                                <label for="description" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Deskripsi</label>
                                <textarea id="description" name="description" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 5px; background: var(--bg);" rows="4"></textarea>
                            </div>
                            <div style="margin-bottom: 1rem;">
                                <label for="category" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Kategori</label>
                                <select id="category" name="category" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 5px; background: var(--bg);">
                                    <option value="full-time">Full-Time</option>
                                    <option value="part-time">Part-Time</option>
                                    <option value="internship">Internship</option>
                                    <option value="freelance">Freelance</option>
                                    <option value="volunteer">Volunteer</option>
                                    <option value="research">Research</option>
                                </select>
                            </div>
                            <div style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                                <input type="checkbox" id="is_ongoing" name="is_ongoing">
                                <label for="is_ongoing" style="font-weight: bold;">Sedang berlangsung</label>
                            </div>
                            <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                                <button type="button" class="button button-secondary" popovertarget="add-experience-modal" popovertargetaction="hide">Batal</button>
                                <button type="submit" class="button" style="background-color: #000; color: #fff; border: none;">Simpan</button>
                            </div>
                        </form>
                    </div>
                </div>
                {% endif %}

                <!-- State containers untuk indikator AJAX -->
                <div id="loading" style="text-align: center; margin: 2rem 0;" class="hide">Memuat data...</div>
                <div id="error" style="text-align: center; color: red; margin: 2rem 0;" class="hide">Gagal memuat data.</div>
                <div id="empty" style="text-align: center; margin: 2rem 0;" class="hide">Belum ada pengalaman yang ditemukan.</div>
                
                <div id="grid" class="experience-grid"></div>
                
            </div>
        </section>
    </main>

    {% csrf_token %}
    <script>
    const BASE_EXPERIENCES_ENDPOINT = "{% url 'api:experience-list' %}";
    const DETAIL_EXPERIENCE_ENDPOINT = "{% url 'api:experience-detail' '00000000-0000-0000-0000-000000000000' %}";
    const STAR_EXPERIENCE_ENDPOINT = "{% url 'api:experience-star' '00000000-0000-0000-0000-000000000000' %}";
    const IS_SUPERUSER = "{{ user.is_superuser|yesno:'true,false' }}" === "true";
    const IS_AUTHENTICATED = "{{ user.is_authenticated|yesno:'true,false' }}" === "true";

    const loadingState = document.getElementById('loading');
    const errorState = document.getElementById('error');
    const emptyState = document.getElementById('empty');
    const gridContainer = document.getElementById('grid');
    const searchForm = document.getElementById('experience-search-form'); 
    const searchInput = document.getElementById('search-input');
    const experienceForm = document.getElementById('experience-form');

    let experiencesAbortController;
    let searchDebounceTimer;

    function getCookie(name) {
        const prefix = `${name}=`;
        const cookie = document.cookie.split(';').map(value => value.trim())
            .find(value => value.startsWith(prefix));
        return cookie ? decodeURIComponent(cookie.slice(prefix.length)) : null;
    }

    function escapeHtml(value) {
        return String(value ?? '').replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;').replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    }

    function experienceEndpoint(pattern, id) {
        return pattern.replace('00000000-0000-0000-0000-000000000000', id);
    }

    function displayPageSection({ showLoading = false, showError = false, showEmpty = false, showGrid = false }) {
        if(loadingState) loadingState.classList.toggle('hide', !showLoading);
        if(errorState) errorState.classList.toggle('hide', !showError);
        if(emptyState) emptyState.classList.toggle('hide', !showEmpty);
        if(gridContainer) gridContainer.classList.toggle('hide', !showGrid);
    }

    function buildExperienceCardElement(experience) {
        const article = document.createElement('article');
        article.className = 'experience-card';
        
        const star = IS_AUTHENTICATED
            ? `<button type="button" class="button button-star ${experience.is_starred ? 'is-starred' : ''}" 
                data-action="star" data-id="${escapeHtml(experience.id)}" 
                title="${escapeHtml(experience.starred_by_names)}">
                ${experience.is_starred ? 'Unstar' : 'Star'} (${experience.star_count})</button>`
            : `<a href="{% url 'main:login' %}" class="button">Login to star (${experience.star_count})</a>`;
        
        const remove = IS_SUPERUSER
            ? `<button type="button" class="button button-danger" style="background:none; border:none; color:#b42318; cursor:pointer; font-size:0.85rem; font-weight:bold; padding:0;" data-action="delete" data-id="${escapeHtml(experience.id)}">Hapus</button>` : '';

        const update = IS_SUPERUSER
            ? `<a href="/update-experience/${escapeHtml(experience.id)}/" style="color: #026aa7; font-size: 0.85rem; font-weight: 700; text-decoration: none;">Edit</a>` : '';
        
        const actions = (IS_SUPERUSER) ? `<div style="margin-top: 1.5rem; border-top: 1px solid var(--line); padding-top: 1rem; display: flex; gap: 1rem;">${update}${remove}</div>` : '';

        article.innerHTML = `
            <span class="experience-category">${escapeHtml(experience.category_display)}</span>
            <h2>${escapeHtml(experience.title)}</h2>
            <p class="experience-description">${escapeHtml(experience.description)}</p>
            <p class="experience-status">${experience.is_ongoing ? 'Sedang berlangsung' : 'Selesai'}</p>
            <div style="margin-top: 1rem;">${star}</div>
            ${actions}`;
        return article;
    }

    async function fetchExperiences(searchQuery = '') {
        if (experiencesAbortController) experiencesAbortController.abort();
        experiencesAbortController = new AbortController();
        try {
            displayPageSection({ showLoading: true });
            const url = new URL(BASE_EXPERIENCES_ENDPOINT, window.location.origin);
            if (searchQuery) url.searchParams.set('title', searchQuery);
            
            const response = await fetch(url, {
                headers: { Accept: 'application/json' },
                signal: experiencesAbortController.signal,
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const experiences = await response.json();
            gridContainer.replaceChildren(...experiences.map(buildExperienceCardElement));
            displayPageSection({ showGrid: experiences.length > 0, showEmpty: experiences.length === 0 });
        } catch (error) {
            if (error.name === 'AbortError') return;
            console.error(error);
            displayPageSection({ showError: true });
        }
    }

    function apiErrorMessage(data, status) {
        const messages = Object.values(data).flat().filter(value => typeof value === 'string');
        return messages.join(' ') || `Request failed (HTTP ${status}).`;
    }

    async function writeExperience(url, method, payload) {
        const response = await fetch(url, {
            method,
            headers: {
                Accept: 'application/json',
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken'),
            },
            body: payload === undefined ? undefined : JSON.stringify(payload),
        });
        if (response.status === 204) return null; 
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(apiErrorMessage(data, response.status));
        return data;
    }

    async function addExperience(event) {
        event.preventDefault();
        const button = experienceForm.querySelector('button[type="submit"]');
        if (button) button.disabled = true;
        try {
            const fields = new FormData(experienceForm);
            const payload = Object.fromEntries([
                'title', 'description', 'category', 'is_ongoing'
            ].map(name => [name, fields.get(name)]));
            
            payload.is_ongoing = payload.is_ongoing === 'on' || payload.is_ongoing === 'true';

            await writeExperience(BASE_EXPERIENCES_ENDPOINT, 'POST', payload);
            experienceForm.reset();
            document.getElementById('add-experience-modal')?.hidePopover();
            showToast('Success', 'Experience created.', 'success');
            await fetchExperiences(searchInput ? searchInput.value.trim() : '');
        } catch (error) {
            showToast('Could not create experience', error.message, 'error');
        } finally {
            if (button) button.disabled = false;
        }
    }

    if (experienceForm) experienceForm.addEventListener('submit', addExperience);

    if (gridContainer) {
        gridContainer.addEventListener('click', async function(event) {
            const button = event.target.closest('button[data-action]');
            if (!button || button.disabled) return;
            const action = button.dataset.action;
            if (action === 'delete' && !window.confirm('Hapus pengalaman ini?')) return;
            
            button.disabled = true;
            try {
                const pattern = action === 'star' ? STAR_EXPERIENCE_ENDPOINT : DETAIL_EXPERIENCE_ENDPOINT;
                await writeExperience(experienceEndpoint(pattern, button.dataset.id), action === 'star' ? 'POST' : 'DELETE');
                showToast('Success', action === 'star' ? 'Star di-update.' : 'Pengalaman dihapus.', 'success');
                await fetchExperiences(searchInput ? searchInput.value.trim() : '');
            } catch (error) {
                showToast('Request failed', error.message, 'error');
            } finally {
                button.disabled = false;
            }
        });
    }

    if (searchInput) {
        searchInput.addEventListener('input', function() {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => fetchExperiences(searchInput.value.trim()), 300);
        });
    }

    if (searchForm) {
        searchForm.addEventListener('submit', function(event) {
            event.preventDefault();
            clearTimeout(searchDebounceTimer);
            fetchExperiences(searchInput.value.trim());
        });
    }

    fetchExperiences(searchInput ? searchInput.value.trim() : '');
    </script>
{% endblock content %}
