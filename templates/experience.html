{% extends 'base.html' %}

{% block content %}
    <main>
        <section class="experience-section" id="experience">
            <div class="container">
                <p class="section-kicker">Perjalanan saya sejauh ini</p>
                <h1>Experience</h1>
                
                {% if user.is_superuser %}
                <div style="margin-bottom: 2rem; margin-top: 1rem;">
                    <a href="{% url 'main:create_experience' %}" style="padding: 10px 20px; background-color: #000; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 0.9rem;">
                        + Tambah Pengalaman Baru
                    </a>
                </div>
                {% endif %}

                <!-- Container kosong yang akan diisi oleh JavaScript (AJAX) -->
                <div id="experience_grid" class="experience-grid"></div>
                
            </div>
        </section>
    </main>

    <script>
        const isSuperuser = "{{ user.is_superuser|yesno:'true,false' }}" === "true";
        const isEditor = "{{ is_editor|yesno:'true,false' }}" === "true";
    
        async function getExperiences() {
            return fetch("{% url 'main:get_experiences_json' %}").then((res) => res.json());
        }
    
        async function refreshExperiences() {
            document.getElementById("experience_grid").innerHTML = "";
            const experiences = await getExperiences();
            let htmlString = "";
    
            if (experiences.length === 0) {
                htmlString = `
                    <p class="empty-state">
                        Belum ada pengalaman yang ditambahkan.
                    </p>
                `;
            } else {
                experiences.forEach((item) => {
                    const pk = item.pk;
                    const experience = item.fields;
                    const statusHtml = experience.is_ongoing 
                        ? '<p class="experience-status">Sedang berlangsung</p>' 
                        : '<p class="experience-status">Selesai</p>';
    
                    let actionHtml = '';
                    if (isSuperuser || isEditor) {
                        let deleteBtn = '';
                        if (isSuperuser) {
                            deleteBtn = `
                                <button type="button" popovertarget="delete-experience-${pk}" style="color: #b42318; font-size: 0.85rem; font-weight: 700; background: none; border: none; cursor: pointer; padding: 0; text-decoration: none;">
                                    Hapus
                                </button>
                                
                                <!-- Struktur Modal Hapus langsung disisipkan ke HTML -->
                                <div id="delete-experience-${pk}" class="project-form-modal" popover="auto">
                                    <div class="project-form-modal_content" style="max-width: 400px; text-align: center;">
                                        <h2 style="margin-bottom: 1rem;">Konfirmasi Hapus</h2>
                                        <p>Apakah kamu yakin ingin menghapus pengalaman <strong>${experience.title}</strong>?</p>
                                        <form method="post" action="/delete-experience/${pk}/" style="margin-top: 1.5rem; display: flex; justify-content: center; gap: 1rem;">
                                            {% csrf_token %}
                                            <button type="button" class="button button-secondary" popovertarget="delete-experience-${pk}" popovertargetaction="hide">Batal</button>
                                            <button type="submit" class="button" style="background-color: #b42318; border-color: #b42318;">Ya, Hapus</button>
                                        </form>
                                    </div>
                                </div>
                            `;
                        }
    
                        actionHtml = `
                            <div style="margin-top: 1.5rem; border-top: 1px solid var(--line); padding-top: 1rem; display: flex; gap: 1rem;">
                                <a href="/update-experience/${pk}/" style="color: #026aa7; font-size: 0.85rem; font-weight: 700; text-decoration: none;">Edit</a>
                                ${deleteBtn}
                            </div>
                        `;
                    }
    
                    const starClass = experience.is_starred ? "button-star is-starred" : "button-star";
                    const starText = experience.is_starred ? "Unstar" : "Star";
                    const starForm = `
                        <form action="/experience/${pk}/star/" method="POST" class="star-form">
                            {% csrf_token %}
                            <button type="submit" class="button ${starClass}">
                                ★ ${starText} <span class="star-count">${experience.star_count}</span>
                            </button>
                        </form>
                    `;
    
            
                    htmlString += `
                        <article class="experience-card">
                            <span class="experience-category">${experience.category}</span>
                            <h2>${experience.title}</h2>
                            <p class="experience-description">${experience.description}</p>
                            ${statusHtml}
                            <div style="margin-top: 1rem;">
                                ${starForm}
                            </div>
                            ${actionHtml}
                        </article>
                    `;
                });
            }
            
            document.getElementById("experience_grid").innerHTML = htmlString;
        }
    
        refreshExperiences();
    </script>
{% endblock content %}
